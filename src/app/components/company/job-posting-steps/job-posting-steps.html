<ol class="pasos" [attr.data-label]="'recruitment.steps.label' | translate">
  @for (s of steps; track s.n) {
    <li
      [class.actual]="s.n === step()"
      [class.hecho]="s.n < step()"
      [attr.aria-current]="s.n === step() ? 'step' : null"
    >
      @if (jobId() && s.n !== step()) {
        <a [routerLink]="['/recruitment/my-job-postings', jobId(), s.path]">
          <span class="numero">{{ s.n }}</span>{{ s.label | translate }}
        </a>
      } @else {
        <span class="numero">{{ s.n }}</span>{{ s.label | translate }}
      }
    </li>
  }
</ol>

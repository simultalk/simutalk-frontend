<div class="reloj" role="timer" aria-live="off" [attr.aria-label]="time() + ', ' + date()">
  <svg class="esfera" viewBox="0 0 100 100" aria-hidden="true">
    <circle class="borde" cx="50" cy="50" r="46" />
    @for (t of ticks; track t) {
      <line class="marca" [class.marca--fuerte]="t % 90 === 0" x1="50" y1="8" x2="50" [attr.y2]="t % 90 === 0 ? 15 : 12" [attr.transform]="'rotate(' + t + ' 50 50)'" />
    }
    <line class="aguja aguja--hora" x1="50" y1="50" x2="50" y2="28" [attr.transform]="'rotate(' + hourAngle() + ' 50 50)'" />
    <line class="aguja aguja--minuto" x1="50" y1="50" x2="50" y2="18" [attr.transform]="'rotate(' + minuteAngle() + ' 50 50)'" />
    <line class="aguja aguja--segundo" x1="50" y1="58" x2="50" y2="14" [attr.transform]="'rotate(' + secondAngle() + ' 50 50)'" />
    <circle class="centro" cx="50" cy="50" r="3" />
  </svg>

  <div class="texto">
    <span class="saludo">{{ greetingKey() | translate }}</span>
    <span class="hora">{{ time() }}<small>:{{ seconds() }}</small></span>
    <span class="fecha">{{ date() }}</span>
    @if (city) {
      <span class="zona">{{ city }}</span>
    }
  </div>
</div>

<mat-toolbar class="barra">
  <span>SimuTalk</span>
  <span class="espacio"></span>
  @if (auth.isLoggedIn()) {
    <span class="usuario">{{ auth.username() }}</span>
    <button mat-button (click)="auth.signOut()">Cerrar sesión</button>
  }
</mat-toolbar>

<mat-sidenav-container class="contenedor">
  <mat-sidenav mode="side" opened class="menu">
    <mat-nav-list></mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content class="contenido">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>

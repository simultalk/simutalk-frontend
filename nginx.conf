server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Las llamadas al API pasan al contenedor del backend (servicio "api" del docker-compose).
    # Así el frontend y el API comparten dirección y puerto: no hay CORS ni contenido mixto.
    location ^~ /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos con hash en el nombre (main-XXXX.js, styles-XXXX.css): se pueden guardar en caché.
    location ~* \.(?:js|css|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rutas de Angular (/login, /assessment/ranking, ...): siempre devuelven index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
